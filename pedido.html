<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fazer pedido</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 16px;
        }

        .sabores {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .sabor {
            padding: 15px;
            border: 2px solid #ccc;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 16px;
        }

        .sabor:hover {
            background: #f0f0f0;
        }

        .sabor.selecionado {
            background: #28a745;
            color: white;
            border-color: #28a745;
        }

        #confirmar {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        #mensagem {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>Faça seu pedido</h1>

    <h2>Escolha o sabor da pizza</h2>

    <div class="sabores">
        <button class="sabor" type="button" data-id="1">Peperoni</button>
        <button class="sabor" type="button" data-id="2">Vegetariana</button>
        <button class="sabor" type="button" data-id="3">Metade peperoni e vegetariana</button>
    </div>

    <button id="confirmar" type="button">Confirmar sabor</button>

    <p id="mensagem"></p>

    <script>
        const botoes = document.querySelectorAll(".sabor");
        const confirmar = document.getElementById("confirmar");
        const mensagem = document.getElementById("mensagem");

        let saborSelecionado = null;

        botoes.forEach(botao => {
            botao.addEventListener("click", () => {
                botoes.forEach(b => b.classList.remove("selecionado"));
                botao.classList.add("selecionado");
                saborSelecionado = botao.dataset.id;
                mensagem.textContent = "Sabor selecionado: " + botao.textContent.trim();
            });
        });

        confirmar.addEventListener("click", () => {
            if (saborSelecionado === null) {
                mensagem.textContent = "Escolha um sabor primeiro!";
                return;
            }

            localStorage.setItem("id_sabor", saborSelecionado);
            window.location.href = "tamanhos.html";
        });
    </script>

</body>
</html>
