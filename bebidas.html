<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Escolher bebida</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 16px;
        }

        .bebidas {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .bebida {
            padding: 15px;
            border: 2px solid #ccc;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 16px;
        }

        .bebida:hover {
            background: #f0f0f0;
        }

        .bebida.selecionado {
            background: #28a745;
            color: white;
            border-color: #28a745;
        }

        #confirmar {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        #mensagem {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>Faça seu pedido</h1>

    <h2>Escolha sua bebida</h2>

    <div class="bebidas">
        <button class="bebida" type="button" data-id="1">Agua 500Ml</button>
        <button class="bebida" type="button" data-id="2">Agua com Gas 500Ml</button>
        <button class="bebida" type="button" data-id="3">Coca Cola 600Ml</button>
        <button class="bebida" type="button" data-id="4">Coca Cola 2L</button>
    </div>

    <button id="confirmar" type="button">Confirmar bebida</button>

    <p id="mensagem"></p>

    <script>
        const botoes = document.querySelectorAll(".bebida");
        const confirmar = document.getElementById("confirmar");
        const mensagem = document.getElementById("mensagem");

        let bebidaSelecionada = null;

        botoes.forEach(botao => {
            botao.addEventListener("click", () => {
                botoes.forEach(b => b.classList.remove("selecionado"));
                botao.classList.add("selecionado");
                bebidaSelecionada = botao.dataset.id;
                mensagem.textContent = "Bebida selecionada: " + botao.textContent.trim();
            });
        });

        confirmar.addEventListener("click", () => {
            if (bebidaSelecionada === null) {
                mensagem.textContent = "Escolha uma bebida primeiro!";
                return;
            }

            localStorage.setItem("id_bebida", bebidaSelecionada);
            window.location.href = "bordas.html";
        });
    </script>

</body>
</html>
