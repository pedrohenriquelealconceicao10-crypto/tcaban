<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Escolher borda</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 16px;
        }

        .bordas {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .borda {
            padding: 15px;
            border: 2px solid #ccc;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 16px;
        }

        .borda:hover {
            background: #f0f0f0;
        }

        .borda.selecionado {
            background: #28a745;
            color: white;
            border-color: #28a745;
        }

        #confirmar {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        #mensagem {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>Faça seu pedido</h1>

    <h2>Escolha sua borda</h2>

    <div class="bordas">
        <button class="borda" type="button" data-id="1">Recheada de catupiry</button>
        <button class="borda" type="button" data-id="2">Recheada de Chocolate</button>
        <button class="borda" type="button" data-id="3">Sem recheio</button>
    </div>

    <button id="confirmar" type="button">Confirmar borda</button>

    <p id="mensagem"></p>

    <script>
        const botoes = document.querySelectorAll(".borda");
        const confirmar = document.getElementById("confirmar");
        const mensagem = document.getElementById("mensagem");

        let bordaSelecionada = null;

        botoes.forEach(botao => {
            botao.addEventListener("click", () => {
                botoes.forEach(b => b.classList.remove("selecionado"));
                botao.classList.add("selecionado");
                bordaSelecionada = botao.dataset.id;
                mensagem.textContent = "Borda selecionada: " + botao.textContent.trim();
            });
        });

        confirmar.addEventListener("click", () => {
            if (bordaSelecionada === null) {
                mensagem.textContent = "Escolha uma borda primeiro!";
                return;
            }

            localStorage.setItem("id_borda", bordaSelecionada);
            window.location.href = "condicionamentos.html";
        });
    </script>

</body>
</html>
